# SonarQube Cloud configuration (CI-based analysis via GitHub Actions).
sonar.organization=gundestrup
sonar.projectKey=gundestrup_obsidian-research
sonar.projectName=obsidian-research

# Explicit source roots: production TypeScript only. Keeps the source set
# disjoint from sonar.tests (overlap fails analysis) and keeps the generated
# main.js bundle out of scope entirely.
sonar.sources=main.ts,src
sonar.tests=tests

# Vitest lcov report emitted by `npm run test:coverage` in CI
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Mirror vitest's coverage scope (include src/**/*.ts, minus its excludes):
# main.ts is Obsidian plugin glue outside the instrumented set, and the
# remaining files are deliberately uninstrumented (types, Obsidian UI).
sonar.coverage.exclusions=main.ts,src/types.ts,src/providers/types.ts,src/modals.ts,src/settings.ts
